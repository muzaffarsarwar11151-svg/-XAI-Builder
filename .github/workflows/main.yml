
name: Build XAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get XAI files
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Android App
        run: |
          cordova create xai-apk com.xai.builder XAI
          cp XAI_Full_Fixed.html xai-apk/www/index.html
          cd xai-apk
          cordova platform add android
          cordova build android --debug

      - name: Upload XAI APK
        uses: actions/upload-artifact@v4
        with:
          name: XAI-APK
          path: xai-apk/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
